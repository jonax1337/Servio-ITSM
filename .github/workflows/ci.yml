name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml runs the full CI on the tagged commit before publishing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24" # matches the node:24-slim base of the production image
  NEXT_TELEMETRY_DISABLED: "1"
  # Throwaway values: the build and the tests need them set, never real.
  DATABASE_URL: file:./ci.db
  AUTH_SECRET: ci-only-not-a-secret
  APP_URL: http://localhost:3000

jobs:
  checks:
    name: Lint, types, schema & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the doc-drift check diffs against the PR base
      # pnpm/action-setup reads the pnpm version from package.json#packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Prisma schema is valid
        run: pnpm exec prisma validate
      - name: Committed migrations match the schema
        # Fails when schema.prisma changed without a migration (the drift that
        # breaks `prisma migrate deploy` at container boot).
        run: >-
          pnpm exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url file:./ci-shadow.db
          --exit-code
      - name: Brand assets are in sync
        run: pnpm brand:check
      - name: Typecheck
        run: pnpm typecheck # next typegen first: route types like LayoutProps are generated
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Docs drift (advisory)
        if: github.event_name == 'pull_request'
        run: node scripts/check-doc-drift.mjs --range "origin/${{ github.base_ref }}...HEAD"

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build

  e2e:
    name: Link crawl (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The app under test listens on 3200 (see playwright.config.ts).
      APP_URL: http://localhost:3200
      AUTH_URL: http://localhost:3200
      NEXTAUTH_URL: http://localhost:3200
      AUTH_TRUST_HOST: "true"
      SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Migrate and seed a throwaway database
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Crawl every linked page per role
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: servio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build updater image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: updater
          file: updater/Dockerfile
          push: false
          load: true
          tags: servio-updater:ci
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater
      - name: Updater image loads its modules and reads its manifest
        run: |
          docker run --rm servio-updater:ci node -e "
            import('./update-flow.mjs')
              .then(() => import('./config.mjs'))
              .then((m) => console.log('updater', m.loadConfig({ SERVIO_IMAGE: 'ghcr.io/ci/servio' }).updaterVersion))
          "
      - name: Container refuses a database with migrations the image does not contain
        run: |
          boot() { docker run --rm -e AUTH_SECRET=ci-only-not-a-secret -e DATABASE_URL=file:/data/servio.db -v servio-guard:/data "$@"; }
          # Migrate (and seed) a fresh database, then exit instead of starting Next.
          boot servio:ci true
          # Record a migration that only a newer release ships as applied.
          boot --entrypoint node servio:ci -e '
            const { PrismaClient } = require("@prisma/client");
            const prisma = new PrismaClient();
            prisma
              .$executeRawUnsafe(
                "INSERT INTO _prisma_migrations (id, checksum, finished_at, migration_name, started_at, applied_steps_count) VALUES (?, ?, CURRENT_TIMESTAMP, ?, CURRENT_TIMESTAMP, 1)",
                "ci-newer", "x", "29991231000000_from_a_newer_release",
              )
              .finally(() => prisma.$disconnect());
          '
          if boot servio:ci true > guard.log 2>&1; then
            cat guard.log; echo "::error::the image started on a database migrated by a newer release"; exit 1
          fi
          grep -q "REFUSING TO START" guard.log || { cat guard.log; echo "::error::the image failed for another reason"; exit 1; }
      - name: Container boots and serves /login
        run: |
          docker run -d --name servio-ci -p 3000:3000 \
            -e AUTH_SECRET=ci-only-not-a-secret -e AUTH_TRUST_HOST=true \
            -e DATABASE_URL=file:/data/servio.db -e APP_URL=http://localhost:3000 \
            servio:ci
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/login; then
              echo "healthy after $((i * 2))s"; exit 0
            fi
            sleep 2
          done
          docker logs servio-ci
          exit 1

  updater-e2e:
    name: Updater end-to-end (real Docker, socket proxy, registry)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update to a good release, then roll back a broken one
        run: bash tests/updater-e2e/run.sh
