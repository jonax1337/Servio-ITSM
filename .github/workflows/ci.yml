name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22" # matches the node:22-slim base of the production image
  NEXT_TELEMETRY_DISABLED: "1"
  # Throwaway values: the build and the tests need them set, never real.
  DATABASE_URL: file:./ci.db
  AUTH_SECRET: ci-only-not-a-secret
  APP_URL: http://localhost:3000

jobs:
  checks:
    name: Lint, types, schema & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the doc-drift check diffs against the PR base
      - uses: pnpm/action-setup@v4 # version comes from package.json#packageManager
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Prisma schema is valid
        run: pnpm exec prisma validate
      - name: Committed migrations match the schema
        # Fails when schema.prisma changed without a migration (the drift that
        # breaks `prisma migrate deploy` at container boot).
        run: >-
          pnpm exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url file:./ci-shadow.db
          --exit-code
      - name: Brand assets are in sync
        run: pnpm brand:check
      - name: Typecheck
        run: pnpm typecheck # next typegen first: route types like LayoutProps are generated
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Docs drift (advisory)
        if: github.event_name == 'pull_request'
        run: node scripts/check-doc-drift.mjs --range "origin/${{ github.base_ref }}...HEAD"

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build

  e2e:
    name: Link crawl (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The app under test listens on 3200 (see playwright.config.ts).
      APP_URL: http://localhost:3200
      AUTH_URL: http://localhost:3200
      NEXTAUTH_URL: http://localhost:3200
      AUTH_TRUST_HOST: "true"
      SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Migrate and seed a throwaway database
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Crawl every linked page per role
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: servio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container boots and serves /login
        run: |
          docker run -d --name servio-ci -p 3000:3000 \
            -e AUTH_SECRET=ci-only-not-a-secret -e AUTH_TRUST_HOST=true \
            -e DATABASE_URL=file:/data/servio.db -e APP_URL=http://localhost:3000 \
            servio:ci
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/login; then
              echo "healthy after $((i * 2))s"; exit 0
            fi
            sleep 2
          done
          docker logs servio-ci
          exit 1
