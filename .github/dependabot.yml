version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: npm # pnpm lockfiles are handled by the npm ecosystem
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Majors of the data and mail layers need their own migration branch.
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "imapflow"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      prefix-development: chore

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The image follows the Node LTS line; LTS majors are bumped by hand.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore

  - package-ecosystem: docker
    directory: /updater
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
