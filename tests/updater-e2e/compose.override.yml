# Runs docker-compose.release.yml (the real proxy and updater configuration)
# against a local registry and the stand-in app from tests/updater-e2e/app.
# Used by tests/updater-e2e/run.sh in the updater-e2e CI job only.
services:
  web:
    image: localhost:5000/servio-e2e:1.0.0
    env_file: !reset []
    depends_on: !reset {}
    # Each stand-in release brings its own HEALTHCHECK (some fail sooner than
    # others), so the compose-level one is dropped and the updater carries no
    # container-level health check over.
    healthcheck: !reset {}

  updater:
    # Built from this source by run.sh, reporting version 1.0.0.
    image: localhost:5000/servio-e2e-updater:1.0.0
    environment:
      SERVIO_IMAGE: localhost:5000/servio-e2e
      HEALTH_TIMEOUT_SECONDS: "90"
      UPDATER_SELF_UPDATE_TIMEOUT_SECONDS: "30"
